
name: Build Testing APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          curl -fsSL \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" \
            | sha256sum -c -

      - name: Rebuild APK
        run: |
          test -f apktool.yml
          test -f AndroidManifest.xml
          java -jar apktool.jar b . -o app-unsigned.apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Sign testing APK
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-testing.apk \
            app-unsigned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app-testing.apk

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: android-testing-apk
          path: app-testing.apk
          retention-days: 7
