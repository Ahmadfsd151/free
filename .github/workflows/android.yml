
name: Build Android Testing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Project Files
        run: |
          echo "Checking decoded Android project..."

          test -f AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found in repository root."
            exit 1
          }

          test -f apktool.yml || {
            echo "ERROR: apktool.yml not found in repository root."
            exit 1
          }

          echo "Android project files found."

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            -o apktool.jar

          test -s apktool.jar
          java -jar apktool.jar --version

      - name: Rebuild Android APK
        run: |
          java -jar apktool.jar b . -o app-unsigned.apk

          test -s app-unsigned.apk

          echo "APK rebuild completed."

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Generate Testing Signing Key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" \
            -p -f 4 \
            app-unsigned.apk \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app-testing.apk \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose app-testing.apk

          echo "Signed testing APK is ready."

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: android-testing-apk
          path: app-testing.apk
          if-no-files-found: error
          retention-days: 7
