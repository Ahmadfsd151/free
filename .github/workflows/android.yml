
name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "Repository files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 5 -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts \
            \) -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -maxdepth 5 -type f \
            -name gradlew -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew file found."
            echo "The repository may not contain a complete Gradle project."
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build testing APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-testing-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
